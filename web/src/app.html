<!doctype html>
<html lang="en" class="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon-light.svg" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" media="(prefers-color-scheme: dark)" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Inter + JetBrains Mono are the base system; Fraunces (serif) and Poppins (rounded) back the
		     boutique/pop storefront themes (see web/src/lib/theme.ts). -->
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Poppins:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Apply the saved theme before first paint to avoid a flash of the wrong theme.
			(function () {
				try {
					var saved = localStorage.getItem('theme') || 'system';
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var dark = saved === 'dark' || (saved === 'system' && prefersDark);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.classList.toggle('light', !dark);
				} catch (e) {}
			})();
		</script>
		<!-- TODO: reemplazar por el Measurement ID real de GA4 -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'G-XXXXXXXXXX');
		</script>
		<!-- TODO: reemplazar por el código real de Google Search Console -->
		<meta name="google-site-verification" content="GSC-VERIFICATION-CODE-HERE" />
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "Organization",
			"name": "TuTienda",
			"url": "https://tutienda.com.ar/",
			"logo": "https://tutienda.com.ar/favicon-light.svg"
		}
		</script>
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "SoftwareApplication",
			"name": "TuTienda",
			"applicationCategory": "BusinessApplication",
			"operatingSystem": "Web",
			"description": "Constructor de ecommerce multi-tienda: creá tu tienda online, cargá productos y vendé sin sobrevender stock bajo carga concurrente.",
			"offers": {
				"@type": "Offer",
				"price": "0",
				"priceCurrency": "USD"
			}
		}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-bg text-text">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
