name: deploy

# Push a main en GitHub -> deploy completo en un solo paso:
#   1. backend del compose (mongo/redis/minio quedan; rebuild de accounts/catalog/inventory/orders)
#      por SSH como ubuntu@VPS: git pull + docker compose up -d --build <servicios>.
#   2. gateway (api) + storefront (web) a Dokku (lo público con SSL).
# Requiere en el VPS: ~/tutienda como checkout git con remote SSH (deploy key) y branch main trackeando
# origin/main; y el secret VPS_SSH_PRIVATE_KEY (clave de ubuntu@VPS). Ver README § Deployment.
# OJO: NO corre seeds ni toca volúmenes. Mongo/Redis/MinIO persisten entre deploys (no se pierde data).
# gateway/web del compose se excluyen a propósito del `up` en el VPS (auditoría de seguridad
# 2026-08-28): son redundantes con tutienda-api/tutienda-web de Dokku, no tienen TLS ni pasan por
# nginx, y quedaban expuestos directo en :8080/:3000. Siguen definidos en el compose porque hacen
# falta para `docker compose up --build` completo en dev local — no se tocan, solo no se levantan acá.
on:
  push:
    branches: [main]

# Un solo deploy a la vez.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Gate: si los tests rompen, no se deploya nada.
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/go.sum
      - name: go test -race
        working-directory: services
        env:
          MONGO_URI: mongodb://localhost:27017  # prende los tests de integración de inventory
        run: go test -race ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Dokku necesita la historia, no un shallow clone

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_PRIVATE_KEY }}" > ~/.ssh/dokku
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps
          chmod 600 ~/.ssh/dokku ~/.ssh/vps
          ssh-keyscan -H 146.181.35.182 >> ~/.ssh/known_hosts

      # 1) Público (Dokku, con SSL): gateway + storefront. Es el camino ya probado, va primero.
      - name: Deploy API (gateway)
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/dokku -o IdentitiesOnly=yes
        run: git push --force dokku@146.181.35.182:tutienda-api HEAD:main

      - name: Deploy WEB (storefront)
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/dokku -o IdentitiesOnly=yes
        run: git push --force dokku@146.181.35.182:tutienda-web HEAD:main

      # 2) Backend: el VPS hace pull del código nuevo y rebuildea los servicios del compose.
      #    NO usa -v (no borra volúmenes) y NO corre seeds: la data persiste.
      #    Servicios explícitos a propósito — gateway/web quedan afuera (ver comentario arriba).
      - name: Deploy backend (compose en el VPS)
        run: |
          ssh -i ~/.ssh/vps -o IdentitiesOnly=yes ubuntu@146.181.35.182 \
            'cd ~/tutienda && git pull --ff-only && docker compose up -d --build mongo redis minio minio-init accounts catalog inventory orders'
