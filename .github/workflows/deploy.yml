name: deploy

# Push a main en GitHub -> deploya gateway (api) + storefront (web) a Dokku.
# OJO: los servicios de compose (mongo/redis/minio + catalog/inventory/orders/accounts)
# se manejan a mano por SSH en ~/tutienda del VPS; esto NO los toca.
on:
  push:
    branches: [main]

# Un solo deploy a la vez.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Gate: si los tests rompen, no se deploya nada.
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/go.sum
      - name: go test -race
        working-directory: services
        env:
          MONGO_URI: mongodb://localhost:27017  # prende los tests de integración de inventory
        run: go test -race ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Dokku necesita la historia, no un shallow clone

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 146.181.35.182 >> ~/.ssh/known_hosts

      - name: Deploy API (gateway)
        run: git push --force dokku@146.181.35.182:tutienda-api HEAD:main

      - name: Deploy WEB (storefront)
        run: git push --force dokku@146.181.35.182:tutienda-web HEAD:main
